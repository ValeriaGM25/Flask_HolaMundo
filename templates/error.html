{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="app-container error-page">

    <h1 class="error-code">⚠️</h1>

    <h2 class="error-title">
        Algo salió mal
    </h2>

    <p class="error-message">
        Ocurrió un problema al procesar tu solicitud.<br>
        Por favor, intenta nuevamente o regresa al inicio.
    </p>

    <a href="{{ url_for('main.home') }}" class="btn-error">
        Volver al inicio
    </a>

</div>
{% endblock %}
