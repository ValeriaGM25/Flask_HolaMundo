{% extends "base.html" %}

{% block title %}Gestión de Usuarios{% endblock %}

{% block content %}
<style>
  /* UI REFINADA */
  .crud-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .crud-title { font-weight: 800; letter-spacing: -0.5px; color: #1e293b; }
  .crud-topbar { 
    display: flex; align-items: center; gap: 12px; background: #fff; 
    border-radius: 20px; padding: 12px 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); 
    margin-bottom: 1rem; border: 1px solid #f1f5f9; 
  }
  .search-pill { 
    flex: 1; display: flex; align-items: center; gap: 10px; background: #f8fafc; 
    border-radius: 999px; padding: 6px 15px; border: 1px solid #e2e8f0; transition: all 0.2s; 
  }
  .search-pill:focus-within { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
  .search-pill input { border: 0; background: transparent; width: 100%; outline: none; color: #475569; }
  
  /* TARJETA Y TABLA */
  .crud-card { background: #fff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; overflow: hidden; }
  .table thead th { background: #f8fafc; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; color: #64748b; padding: 15px; border-bottom: 1px solid #f1f5f9; }
  
  /* ACCIONES */
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .btn-edit-action { background: #f0fdf4; color: #166534; padding: 6px 14px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 0.85rem; transition: 0.2s; }
  .btn-edit-action:hover { background: #dcfce7; }
  .btn-del-action { background: #fef2f2; color: #991b1b; padding: 6px 14px; border-radius: 10px; font-weight: 600; border: 0; font-size: 0.85rem; transition: 0.2s; }
  .btn-del-action:hover { background: #fee2e2; }

  /* PAGINACIÓN ESTILO MODERNO */
  .pagination-container {
    background: #f8fafc;
    padding: 1rem 1.5rem;
    border-top: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pagination-buttons { display: flex; gap: 8px; align-items: center; }
  .btn-page {
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: white;
    color: #475569;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s;
    cursor: pointer;
  }
  .btn-page:hover:not(:disabled) { border-color: #6366f1; color: #6366f1; background: #f5f3ff; }
  .btn-page.active { background: #6366f1; color: white; border-color: #6366f1; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
  .btn-page:disabled { opacity: 0.4; cursor: not-allowed; background: #f1f5f9; }

  .alert-floating { position: fixed; top: 25px; right: 25px; z-index: 1060; min-width: 320px; }
</style>

<div class="container py-2">
  <div id="alertBox" class="alert-floating"></div>

  <div class="crud-header">
    <h2 class="crud-title">Directorio de Usuarios</h2>
    <a class="btn btn-light btn-sm fw-bold border" href="{{ url_for('main.home') }}">Volver al Inicio</a>
  </div>

  <div class="crud-topbar">
    <div class="search-pill">
      <i class="bi bi-search text-muted"></i>
      <input id="q" placeholder="Buscar por nombre, correo o departamento...">
    </div>
    <button id="btnToggleFilters" class="btn btn-white border px-3 d-flex align-items-center gap-2" style="border-radius: 12px; height: 42px;">
      <i class="bi bi-funnel"></i> <span>Filtros</span>
    </button>
    <button class="btn btn-primary px-4 d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalNuevo" style="border-radius: 12px; height: 42px; font-weight: 600;">
      <i class="bi bi-person-plus-fill"></i> Nuevo
    </button>
  </div>

  <div id="filtersPanel" class="collapse mb-3">
    <div class="card card-body border-0 shadow-sm" style="border-radius: 16px;">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="small fw-bold text-muted mb-2 text-uppercase">Departamento</label>
          <select class="form-select border-0 bg-light" id="f_departamento" style="border-radius: 10px;">
            <option value="">Todos los departamentos</option>
            {% for d in (departamentos_db or []) %}
              <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
            <option value="Sin asignar">Sin asignar</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="small fw-bold text-muted mb-2 text-uppercase">Nacidos desde</label>
          <input type="date" class="form-control border-0 bg-light" id="f_fecha_inicio" style="border-radius: 10px;">
        </div>
        <div class="col-md-4">
          <label class="small fw-bold text-muted mb-2 text-uppercase">Nacidos hasta</label>
          <input type="date" class="form-control border-0 bg-light" id="f_fecha_fin" style="border-radius: 10px;">
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-link text-muted text-decoration-none" id="btnReset">Limpiar filtros</button>
          <button id="btnBuscar" class="btn btn-dark px-4 fw-bold" style="border-radius: 10px;">Aplicar Filtros</button>
        </div>
      </div>
    </div>
  </div>

  <div class="crud-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="ps-4">Nombre</th>
            <th>Email</th>
            <th>Departamento</th>
            <th>Fecha Nac.</th>
            <th class="pe-4 text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyUsuarios">
          </tbody>
      </table>
    </div>
    
    <div class="pagination-container">
      <div class="text-muted small fw-bold" id="totalInfo">Cargando...</div>
      <div class="pagination-buttons" id="paginationWrapper">
        </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
      <div class="modal-header border-0 px-4 pt-4">
        <h5 class="modal-title fw-bold">Crear Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formCrear" class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold small">NOMBRE COMPLETO</label>
            <input class="form-control bg-light border-0" id="nombreNew" placeholder="Ej: Juan Pérez" required style="border-radius: 10px;">
          </div>
          <div class="col-12">
            <label class="form-label fw-bold small">CORREO ELECTRÓNICO</label>
            <input type="email" class="form-control bg-light border-0" id="emailNew" placeholder="juan@ejemplo.com" required style="border-radius: 10px;">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">DEPARTAMENTO</label>
            <input class="form-control bg-light border-0" id="departamentoNew" placeholder="Ej: TI" style="border-radius: 10px;">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">FECHA NACIMIENTO</label>
            <input type="date" class="form-control bg-light border-0" id="fechaNacNew" required style="border-radius: 10px;">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 p-4 pt-0">
        <button class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnCrear" class="btn btn-primary px-4 fw-bold" style="border-radius: 10px;">Guardar Usuario</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const tbody = document.getElementById("tbodyUsuarios");
  const qInput = document.getElementById("q");
  const fDept = document.getElementById("f_departamento");
  const fFInicio = document.getElementById("f_fecha_inicio");
  const fFFin = document.getElementById("f_fecha_fin");
  const alertBox = document.getElementById("alertBox");
  const paginationWrapper = document.getElementById("paginationWrapper");
  const totalInfo = document.getElementById("totalInfo");
  const btnCrear = document.getElementById("btnCrear");

  let currentPage = 1;

  // Cargar datos de la API
  async function cargar(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({
      page: page,
      q: qInput.value.trim(),
      departamento: fDept.value,
      fecha_inicio: fFInicio.value,
      fecha_fin: fFFin.value
    });

    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm"></div></td></tr>`;

    try {
      const res = await fetch(`/api/usuarios?${params.toString()}`);
      const data = await res.json();
      
      if (!data.ok) throw new Error(data.error);

      // Renderizar filas
      tbody.innerHTML = data.items.length === 0 
        ? `<tr><td colspan="5" class="text-center py-5 text-muted">No se encontraron usuarios</td></tr>`
        : data.items.map(u => `
          <tr data-id="${u.id}">
            <td class="ps-4"><div class="fw-bold text-dark">${esc(u.nombre)}</div></td>
            <td class="text-muted small">${esc(u.email)}</td>
            <td><span class="badge rounded-pill bg-light text-secondary border px-3">${esc(u.departamento || 'Sin asignar')}</span></td>
            <td class="small">${u.fecha_nacimiento || '-'}</td>
            <td class="pe-4 text-end">
              <div class="actions">
                <a class="btn-edit-action" href="/usuarios/editar/${u.id}">Editar</a>
                <button class="btn-del-action btn-del-row">Borrar</button>
              </div>
            </td>
          </tr>`).join("");

      // Info de totales
      totalInfo.innerText = `Mostrando ${data.items.length} de ${data.total_items} usuarios`;

      // Renderizar controles de paginación
      renderPagination(data.page, data.total_pages);

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
    }
  }

  function renderPagination(current, total) {
    let html = '';
    
    // Flecha Anterior
    html += `<button class="btn-page" ${current <= 1 ? 'disabled' : ''} onclick="goToPage(${current - 1})" title="Anterior">
               <i class="bi bi-chevron-left"></i>
             </button>`;

    // Números de página (solo se muestran si hay más de 1 página)
    if (total > 0) {
      for (let i = 1; i <= total; i++) {
        // Lógica para no mostrar demasiados números si hubiera 100 páginas (opcional)
        html += `<button class="btn-page ${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
    }

    // Flecha Siguiente
    html += `<button class="btn-page" ${current >= total ? 'disabled' : ''} onclick="goToPage(${current + 1})" title="Siguiente">
               <i class="bi bi-chevron-right"></i>
             </button>`;

    paginationWrapper.innerHTML = html;
  }

  // Función global para los botones de la paginación
  window.goToPage = (page) => {
    cargar(page);
  };

  async function crear() {
    const payload = {
      nombre: document.getElementById("nombreNew").value.trim(),
      email: document.getElementById("emailNew").value.trim(),
      departamento: document.getElementById("departamentoNew").value.trim(),
      fecha_nacimiento: document.getElementById("fechaNacNew").value
    };

    if(!payload.nombre || !payload.email || !payload.fecha_nacimiento) {
      return showAlert("Por favor, completa todos los campos requeridos.");
    }

    try {
      const res = await fetch("/api/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      
      if(data.ok) {
        showAlert("Usuario creado correctamente ✅", "success");
        bootstrap.Modal.getInstance(document.getElementById('modalNuevo')).hide();
        document.getElementById("formCrear").reset();
        cargar(1); // Volver a la página 1 para ver el nuevo registro
      } else {
        showAlert("Error: " + data.error);
      }
    } catch(e) { 
      showAlert("Error de conexión con el servidor."); 
    }
  }

  async function eliminar(id) {
    if(!confirm("¿Estás seguro de que deseas eliminar este usuario?")) return;
    try {
      const res = await fetch(`/api/usuarios/${id}`, { method: "DELETE" });
      const data = await res.json();
      if(data.ok) { 
        showAlert("Usuario eliminado", "warning"); 
        cargar(currentPage); 
      }
    } catch(e) { 
      showAlert("No se pudo eliminar el usuario."); 
    }
  }

  // Utilidades
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  function showAlert(msg, type="danger") {
    alertBox.innerHTML = `<div class="alert alert-${type} shadow-lg border-0 fade show" role="alert" style="border-radius:12px;"><i class="bi bi-info-circle me-2"></i>${msg}</div>`;
    setTimeout(() => alertBox.innerHTML = "", 3000);
  }

  // Eventos de botones
  btnCrear.onclick = crear;
  document.getElementById("btnBuscar").onclick = () => cargar(1);
  document.getElementById("btnReset").onclick = () => {
    qInput.value = ""; fDept.value = ""; fFInicio.value = ""; fFFin.value = "";
    cargar(1);
  };

  qInput.addEventListener("keypress", (e) => { if(e.key === "Enter") cargar(1); });

  document.getElementById("btnToggleFilters").onclick = () => {
    const panel = document.getElementById('filtersPanel');
    bootstrap.Collapse.getOrCreateInstance(panel).toggle();
  };

  tbody.addEventListener("click", e => {
    const btn = e.target.closest(".btn-del-row");
    if(btn) eliminar(btn.closest("tr").dataset.id);
  });

  // Inicio
  cargar();
});
</script>
{% endblock %}
