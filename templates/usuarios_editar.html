{% extends "base.html" %}
{% block title %}Editar Usuario{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <div class="card shadow border-0" style="border-radius: 15px;">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-4">Actualizar Usuario</h3>
            
            <form method="POST" action="{{ url_for('main.usuarios_editar', id=usuario.id) }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nombre</label>
                        <input type="text" class="form-control" name="nombre" value="{{ usuario.nombre }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ usuario.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Departamento</label>
                        <input type="text" class="form-control" name="departamento" value="{{ usuario.departamento or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Fecha Nacimiento</label>
                        <input type="date" class="form-control" name="fecha_nacimiento" value="{{ usuario.fecha_nacimiento or '' }}">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-5">
                    <button type="submit" class="btn btn-primary px-4 fw-bold" style="border-radius: 10px;">
                        Guardar Cambios
                    </button>
                    <a href="{{ url_for('main.usuarios') }}" class="btn btn-light border px-4" style="border-radius: 10px;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
