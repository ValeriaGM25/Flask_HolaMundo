{% extends "base.html" %}

{% block content %}
<div class="container">

    <h1>Python Flask</h1>

    <form method="POST">
        <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>
        <button type="submit">Enviar</button>
    </form>

    {% if mensaje %}
        <p class="mensaje">{{ mensaje }}</p>
    {% endif %}

    <h2>Datos guardados</h2>

    <table>
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Mensaje</th>
            <th>Acción</th>
        </tr>

        {% for r in registros %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>
                <form method="POST" action="{{ url_for('eliminar_registro', id=r[0]) }}"
                      onsubmit="return confirm('¿Seguro que deseas eliminar este registro?');">
                    <button style="background:#dc2626;">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>
{% endblock %}
