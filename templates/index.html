{% extends "base.html" %}

{% block content %}
<div class="container">

    <h1 class="mb-4">Python Flask</h1>

    <!-- ========================= -->
    <!-- CARRUSEL -->
    <!-- ========================= -->
    <div id="carouselExample" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='img/slide1.jpg') }}"
                     class="d-block w-100"
                     alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/slide2.jpg') }}"
                     class="d-block w-100"
                     alt="Slide 2">
            </div>

            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/slide3.jpg') }}"
                     class="d-block w-100"
                     alt="Slide 3">
            </div>

        </div>

        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- ========================= -->
    <!-- FORMULARIO -->
    <!-- ========================= -->
    <form method="POST" class="mb-4">
        <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>
        <button class="btn btn-primary mt-2" type="submit">Enviar</button>
    </form>

    {% if mensaje %}
        <p class="alert alert-info">{{ mensaje }}</p>
    {% endif %}

    <!-- ========================= -->
    <!-- TABLA -->
    <!-- ========================= -->
    <h2>Datos guardados</h2>

    <table class="table table-bordered table-striped">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Mensaje</th>
            <th>Acción</th>
        </tr>

        {% for r in registros %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>
                <form method="POST"
                      action="{{ url_for('eliminar_registro', id=r[0]) }}"
                      onsubmit="return confirm('¿Seguro que deseas eliminar este registro?');">
                    <button class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>
{% endblock %}
