{% extends "base.html" %}

{% block content %}
<div class="container">

    <h1>Python Flask</h1>

    <form method="POST">
        <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>
        <button type="submit">Enviar</button>
    </form>

    {% if mensaje %}
        <p class="mensaje">{{ mensaje }}</p>
    {% endif %}

    <h2>Datos guardados</h2>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Mensaje</th>
        </tr>
        {% for r in registros %}
        <tr>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>
{% endblock %}
